# Publishes every public package. See docs/RELEASING.md.
#
#   tag vX.Y.Z      → X.Y.Z on `latest`             (environment: release)
#   push to main    → {next patch}-next.… on `next` (environment: preview)
#   push to branch  → {next patch}-{branch}.… on `{branch}`
#
# npm trusted publishing names this file, so keep the filename.

name: Release

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - 'v*'
    # Not evaluated for tag pushes.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Node comes from .nvmrc (setup-node node-version-file), shared with local runs.
  BUN_VERSION: '1.3.14'
  # 12.2.0 is the first release with OIDC for `npm dist-tag`.
  NPM_VERSION: '12.2.0'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      staging_tag: ${{ steps.resolve.outputs.staging_tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      branch: ${{ steps.resolve.outputs.branch }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - id: resolve
        env:
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci-version.js

  test:
    name: Lint and test
    needs: version
    # A release commit pushed with its tag: the tag's run tests and publishes it.
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - run: bun run lint

      # Workspace packages resolve to their dist: the root vite.config.js imports @seedprotocol/vite,
      # the SDK type check (first step of `bun run test`) imports eas, arweave and query, the
      # publish bun:test files import sdk and react, and feed-hyper's tests import feed. Package builds only, not build:* (those run the
      # tests first); SKIP_TESTS stops sdk's and react's build scripts doing the same.
      - name: Build workspace packages the tests import
        env:
          SKIP_TESTS: '1'
        run: node scripts/build-packages.js bundler-core archive eas arweave query feed vite sdk react next

      - run: bun run test

  publish:
    name: Publish to npm
    needs: [version, test]
    runs-on: ubuntu-latest
    environment: ${{ needs.version.outputs.channel }}
    permissions:
      contents: read
      id-token: write
    env:
      # Tests ran in the test job on this SHA; this job only runs after it passes.
      SKIP_TESTS: '1'
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_STAGING_TAG: ${{ needs.version.outputs.staging_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g "npm@$NPM_VERSION"

      # Before stamping: bun.lock records workspace versions.
      - run: bun install --frozen-lockfile

      - name: Stamp version (not committed)
        run: node scripts/sync-versions.js "$RELEASE_VERSION"

      - run: bun run build:all

      - name: Publish under the staging tag
        run: node scripts/publish-package.js -y all --tag "$RELEASE_STAGING_TAG" --provenance

  # Its own job so a failure (npm reads and writes can lag a publish by minutes) is re-run
  # without rebuilding or re-checking every package.
  promote:
    name: Move dist-tag
    needs: [version, publish]
    runs-on: ubuntu-latest
    # npm's trusted publisher for dist-tag writes is matched on workflow file and environment.
    environment: ${{ needs.version.outputs.channel }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_DIST_TAG: ${{ needs.version.outputs.dist_tag }}
      RELEASE_STAGING_TAG: ${{ needs.version.outputs.staging_tag }}
      RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
      RELEASE_BRANCH: ${{ needs.version.outputs.branch }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g "npm@$NPM_VERSION"

      - name: Move dist-tag and remove staging tags
        run: node scripts/promote-dist-tag.js

  github-release:
    name: GitHub Release
    needs: [version, promote]
    if: needs.version.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      # Writes the release, and deletes older tags that never published
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Older vX.Y.Z tags whose release failed before publishing and was skipped. Only warns on problems.
      - name: Remove unreleased tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-unreleased-tags.js

      - name: Generate changelog
        env:
          # The last tag that reached npm, so a skipped failed tag's changes stay in the notes
          PREVIOUS_RELEASED_TAG: ${{ steps.tags.outputs.previous_tag }}
        run: |
          TAG_NAME="v$RELEASE_VERSION"
          PREVIOUS_TAG="$PREVIOUS_RELEASED_TAG"
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$TAG_NAME^" 2>/dev/null || echo "")
          fi

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log "$TAG_NAME" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log "$PREVIOUS_TAG..$TAG_NAME" --pretty=format:"- %s (%h)" --no-merges)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes detected"
          fi

          cat > release_notes.md <<EOF
          ## Changes in $TAG_NAME

          $CHANGELOG

          ---

          **Full Changelog**: ${PREVIOUS_TAG:+${PREVIOUS_TAG}...}${TAG_NAME}
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
