name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Same as release.yml: the tests import these workspace packages from their dist
      - name: Build workspace packages the tests import
        env:
          SKIP_TESTS: '1'
        run: node scripts/build-packages.js bundler-core archive eas arweave query feed vite sdk react next

      - name: Run tests
        run: bun run test
        env:
          # Optional: the Arweave integration test asks this Hyper gateway first when it's set.
          SEED_GATEWAY_HYPER_KEY: ${{ secrets.SEED_GATEWAY_HYPER_KEY }}
